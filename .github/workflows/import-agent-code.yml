name: Import deletion audit agent code

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-agent-code.yml"

permissions:
  contents: write

jobs:
  import-agent-code:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate and install uploaded code files
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp_agent_upload/chunk*.txt | tr -d '\r\n' > /tmp/code-folder-upload.zip.b64
          base64 --decode /tmp/code-folder-upload.zip.b64 > /tmp/code-folder-upload.zip
          unzip -t /tmp/code-folder-upload.zip
          mkdir -p /tmp/agent-package
          unzip -oq /tmp/code-folder-upload.zip -d /tmp/agent-package
          test -s /tmp/agent-package/code/main.py
          test -s /tmp/agent-package/code/evaluation/main.py
          test -s /tmp/agent-package/code/evaluation/run_diagnostics.json
          cp -a /tmp/agent-package/code/. code/
          rm -rf .tmp_agent_upload
          rm -f .github/workflows/import-agent-code.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add deletion audit agent implementation and diagnostics"
          git push
